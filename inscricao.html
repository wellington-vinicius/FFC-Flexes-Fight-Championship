
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Inscrição - FFC</title>
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <nav class="menu">
            <h2>FFC</h2>
            <ul>
                <li><a href="index.html">Voltar ao início</a></li>
            </ul>
        </nav>
    </header>

    <main class="pagina-inscricao">

        <h1>INSCRIÇÃO DE LUTADORES</h1>

        <p>Está preparado para entrar no octógono?</p>

        <form id="formulario">

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" placeholder="Sua idade" min="18" required>

            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" placeholder="Ex: 75" min="1" step="0.1" required>

            <label for="categoria">Categoria:</label>
            <select id="categoria" required>
                <option value="">Selecione sua categoria</option>
                <option value="Peso Mosca">Peso Mosca</option>
                <option value="Peso Galo">Peso Galo</option>
                <option value="Peso Pena">Peso Pena</option>
                <option value="Peso Leve">Peso Leve</option>
                <option value="Peso Meio-Médio">Peso Meio-Médio</option>
                <option value="Peso Médio">Peso Médio</option>
                <option value="Peso Meio-Pesado">Peso Meio-Pesado</option>
                <option value="Peso Pesado">Peso Pesado</option>
            </select>

            <button type="submit" class="botao-inscricao">
                FINALIZAR INSCRIÇÃO
            </button>

        </form>

        <div id="mensagem-sucesso" class="mensagem-sucesso" hidden>
            <h2>PARABÉNS!</h2>
            <p>VOCÊ CRUZOU A LINHA QUE SEPARA OS FRACOS DOS FORTES!</p>
            <h3>BEM-VINDO, GUERREIRO!</h3>
            <a href="index.html">VOLTAR AO INÍCIO</a>
        </div>

    </main>

</body>
</html>
